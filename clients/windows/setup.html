<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إعداد NineSoft</title><style>*{box-sizing:border-box}body{font:15px/1.7 Tahoma,Arial;background:#f0f8fc;color:#09254b;margin:0;display:grid;place-items:center;height:100vh}.box{width:90%;background:white;padding:28px;border:1px solid #dfebf4;border-radius:20px;box-shadow:0 14px 35px #16486616}h1{margin:0 0 10px}input{width:100%;padding:13px;border:1px solid #ccdfe9;border-radius:10px;direction:ltr;text-align:left;margin:13px 0}button{width:100%;background:#008d81;color:white;border:0;padding:13px;border-radius:10px;font-weight:800;cursor:pointer}.note{color:#7b8ea2;font-size:12px}.error{color:#b42543}</style></head>
<body><div class="box"><h1>NineSoft | ناين سوفت</h1><p>أدخل رابط نظامك بعد رفعه إلى Hostinger. ستتصل نسخة Windows بنفس قاعدة البيانات على الويب وأندرويد.</p>
<form id="f"><label>عنوان الخادم<br><input id="url" type="url" placeholder="https://accounting.example.com" required></label><button id="b" type="submit">حفظ والاتصال بالنظام</button></form>
<p id="error" class="error" role="alert"></p><p class="note">يتطلب HTTPS. لا نخزن كلمة المرور في تطبيق سطح المكتب؛ بيانات الدخول محفوظة ضمن جلسة الخادم.</p></div>
<script>document.getElementById('f').addEventListener('submit',async(e)=>{e.preventDefault();const b=document.getElementById('b');b.disabled=true;try{const x=await window.ninesoftSetup.configure(document.getElementById('url').value);if(!x.ok)document.getElementById('error').textContent=x.error}catch(err){document.getElementById('error').textContent='تعذر الحفظ'}finally{b.disabled=false}})</script>
</body></html>
