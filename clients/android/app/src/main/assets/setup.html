<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:15px/1.7 Tahoma,Arial;background:#f1f8fd;color:#09254b;margin:0;display:grid;place-items:center;min-height:100vh}.card{padding:22px;background:white;margin:16px;border-radius:19px;box-shadow:0 6px 25px #06355522}h1{font-size:25px}input{width:100%;padding:12px;box-sizing:border-box;border:1px solid #c5dbe6;border-radius:10px;direction:ltr;text-align:left}button{background:#008d81;color:white;border:0;border-radius:10px;padding:13px;width:100%;font-weight:800;margin-top:13px}button.secondary{background:#e9f4f8;color:#09254b;margin-top:8px}</style></head>
<body><div class="card"><h1>NineSoft | ناين سوفت</h1><p>أدخل رابط النظام المستضاف على Hostinger لتعمل نسخة Android على نفس بيانات نسخة الويب وويندوز.</p><form id="setup"><input id="server" type="url" required placeholder="https://accounting.example.com"><button>اتصال آمن بالنظام</button></form><button type="button" class="secondary" id="try-demo">تجربة NineSoft بدون رابط أو إنترنت</button><p><small>يلزم HTTPS. تخزن بيانات تسجيل الدخول في جلسة الخادم الآمنة.</small></p></div>
<script>document.getElementById('setup').addEventListener('submit',function(e){e.preventDefault();NineSoftSetup.configure(document.getElementById('server').value)});document.getElementById('try-demo').addEventListener('click',function(){NineSoftSetup.preview()})</script></body></html>
