name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "clients/android/**"
      - "assets/**"
      - ".github/workflows/android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_TOOL=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDK_TOOL" ]; then echo "Android SDK cmdline tools missing"; exit 1; fi
          "$SDK_TOOL" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: clients/android
        run: gradle assembleDebug --no-daemon
      - name: Verify bundled offline UI preview
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find clients/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)
          [ -n "$APK" ] || { echo "APK missing"; exit 1; }
          for asset in assets/setup.html assets/demo.html assets/demo.js assets/assets/core.js assets/assets/pages.js assets/assets/actions.js assets/assets/style.css assets/assets/logo.svg; do
            unzip -Z1 "$APK" | grep -Fxq "$asset" || { echo "Missing APK asset: $asset"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: NineSoft-Android-debug
          path: clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
